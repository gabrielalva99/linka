packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # Dependência do CLI da Vercel: o script de instalação baixa o binário da
  # plataforma. Sem isto o pnpm bloqueia a instalação inteira e o CLI não roda.
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@remotion/bundler@4.0.506'
  - '@remotion/captions@4.0.506'
  - '@remotion/cli@4.0.506'
  - '@remotion/compositor-darwin-arm64@4.0.506'
  - '@remotion/compositor-darwin-x64@4.0.506'
  - '@remotion/compositor-linux-arm64-gnu@4.0.506'
  - '@remotion/compositor-linux-arm64-musl@4.0.506'
  - '@remotion/compositor-linux-x64-gnu@4.0.506'
  - '@remotion/compositor-linux-x64-musl@4.0.506'
  - '@remotion/compositor-win32-x64-msvc@4.0.506'
  - '@remotion/licensing@4.0.506'
  - '@remotion/media-parser@4.0.506'
  - '@remotion/media-utils@4.0.506'
  - '@remotion/player@4.0.506'
  - '@remotion/renderer@4.0.506'
  - '@remotion/streaming@4.0.506'
  - '@remotion/studio-codemods@4.0.506'
  - '@remotion/studio-protocol@4.0.506'
  - '@remotion/studio-server@4.0.506'
  - '@remotion/studio-shared@4.0.506'
  - '@remotion/studio@4.0.506'
  - '@remotion/timeline-utils@4.0.506'
  - '@remotion/web-renderer@4.0.506'
  - '@remotion/zod-types@4.0.506'
  - remotion@4.0.506
  - '@remotion/fonts@4.0.506'
