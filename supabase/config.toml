# LINKA — configuração do projeto Supabase.
#
# ESTE ARQUIVO EXISTE POR CAUSA DE UM APAGÃO. As funções `agent-*` são chamadas
# pelo aparelho na loja, que não tem sessão de usuário: ele se autentica com o
# próprio token de dispositivo, conferido dentro da função. Por isso elas rodam
# com `verify_jwt = false`.
#
# Sem este arquivo, esse ajuste vivia SÓ no painel do Supabase. Qualquer
# republicação assumia o padrão (`verify_jwt = true`) e a frota inteira passava a
# levar 401 na batida seguinte — aparelho no ar, servidor recusando, e ninguém
# olhando o log para descobrir por quê. Aconteceu, e a lição virou este arquivo:
# a configuração acompanha o código, em vez de depender de alguém lembrar.
#
# Regra prática: função nova que o APARELHO chama entra aqui com
# `verify_jwt = false`. Função que o PAINEL chama não entra — ali existe sessão
# de usuário e a verificação é justamente o que a protege.

# NAO RODE `supabase config push` COM ESTE ARQUIVO.
#
# Ele descreve SO as funcoes. Tudo o que nao esta declarado aqui o push aplica
# com o valor PADRAO — e o padrao de `site_url` e `http://localhost:3000`. Um
# push mandaria os links de convite e de recuperacao de senha da producao para o
# localhost de quem rodou o comando, junto com o que mais estiver configurado
# pelo painel e ausente daqui (expiracao de sessao, cadastro aberto ou fechado,
# SMTP). O comando nao tem simulacao nem diff: empurra e aplica.
#
# A configuracao de autenticacao (Site URL e Redirect URLs) vive no painel do
# Supabase, em Authentication > URL Configuration, e hoje precisa apontar para
# https://painel.linkaretail.com.br — o painel mudou de endereco em 20/08.
#
# Para publicar funcao, use `supabase functions deploy <nome>`, que le as secoes
# abaixo sem tocar em mais nada.

project_id = "xkzktmsqtvpkxmzftars"

[functions.agent-heartbeat]
verify_jwt = false

[functions.agent-provision]
verify_jwt = false

[functions.agent-content]
verify_jwt = false

# Faltava, e é a mesma armadilha que este arquivo existe para desarmar: a função
# roda com verify_jwt = false em produção, mas isso só vivia no painel do
# Supabase. Uma publicação pelo CLI assumiria o padrão (true) e a frota inteira
# pararia de entregar medição — sem erro visível no painel, porque o aparelho
# continua reportando estado normalmente pelo heartbeat. Só o relatório secaria.
[functions.agent-events]
verify_jwt = false

# Chamadas pelo banco, não por gente. O cron e o gatilho mandam só o cabeçalho
# x-linka-guarda, cujo valor nasce e mora no cofre; não existe JWT para mandar.
# Com verify_jwt = true as duas levam 401 antes de rodar a primeira linha.
#
# agent-push estava fora deste arquivo e valia só pelo painel do Supabase, que é
# precisamente o descuido descrito acima: uma publicação pelo CLI assumiria o
# padrão e o push da frota morreria calado, porque o heartbeat de 60 s continua
# entregando tudo e nada no painel acusaria.
[functions.agent-push]
verify_jwt = false

[functions.alertas-avisar]
verify_jwt = false
